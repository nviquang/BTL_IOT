# Cấu hình trạm quan trắc không khí AIoT (aiot/config.py đọc file này).
# Không đặt token hay mật khẩu ở đây: bí mật nằm trong .env (xem .env.example).

db_path: /home/admin/iot_data/aiot.db
csv_path: /home/admin/iot_data/sensors.csv
device_id: pi01

# Luật bật/tắt quạt. Thời gian tính bằng giây, PM2.5 tính bằng µg/m³.
control:
  enter_pm25: 55.0          # vào BẢO VỆ: TB 10 phút > 55...
  enter_mean_s: 600
  enter_hold_s: 300         # ...liên tục >= 5 phút
  exit_pm25: 35.0           # thoát BẢO VỆ: TB 15 phút < 35...
  exit_mean_s: 900
  exit_hold_s: 900          # ...liên tục >= 15 phút
  min_state_s: 600          # và đã giữ trạng thái >= 10 phút
  danger_pm25: 150.0        # mức khẩn cấp: vào ngay
  danger_window_s: 60
  proactive_pm25: 100.0     # dự báo TB 3 giờ tới > 100 thì bật quạt trước
  forecast_max_age_s: 5400  # dự báo cũ hơn (giây) thì controller bỏ qua
  stale_s: 120              # mất dữ liệu PM > 2 phút: giữ nguyên trạng thái, ghi sự kiện sensor_fault
  override_ttl_s: 7200      # ghi đè thủ công hết hạn sau 2 giờ
  stale_command_s: 120      # lệnh từ web chờ quá 120 s (+ loop_s) mà controller chưa nhận thì bỏ
  loop_s: 5                 # 5 giây: bộ nhận diện nguồn bụi dự đoán mỗi vòng
  demo: true                # true: mọi thời gian chờ và cửa sổ TB rút còn demo_wait_s
  demo_wait_s: 20

# Còi báo vượt ngưỡng tại chỗ (aiot/alarm.py, aiot/buzzer.py), chạy trong aiot-controller.
# Module còi chủ động kích mức thấp: VCC pin 17 (3.3V), GND pin 25, I/O pin 29 (GPIO5).
# Kêu cả khi mất Internet. Bật/giữ im thủ công từ web.
buzzer:
  enabled: true
  gpio: 5                   # GPIO5 mặc định kéo lên khi Pi khởi động nên còi im
  active_low: true          # module ghi 低电平触发: I/O = LOW thì kêu
  alarm_pm25: 150.0         # kêu khi trung vị PM2.5 1 phút >= ngưỡng
  beep_on_s: 0.3
  beep_off_s: 0.2
  burst_s: 10.0             # một hồi còi 10 giây
  repeat_s: 300             # còn vượt thì kêu lại sau 5 phút; hết vượt thì tắt ngay
  mute_s: 1800              # tắt tiếng không kèm thời gian: 30 phút
  manual_max_s: 60          # bật còi thủ công từ web tối đa 60 giây rồi tự tắt

# Bộ nhận diện nguồn bụi bằng AI: logistic regression (aiot/source_model.py), models/source_logreg.json
# do training/train_logreg.py tạo. Dự đoán mỗi control.loop_s giây từ cửa sổ 120 s mẫu 1 giây,
# so với nền phòng (phân vị 10 của 30 phút qua).
# Bảng hành động cố định: bình thường -> quạt tắt, còi im; nấu ăn -> chỉ quạt;
# ô nhiễm bụi mịn -> quạt + còi.
# Không có mô hình / thiếu dữ liệu / chưa đủ tin cậy: dùng luật ngưỡng PM2.5 ở trên.
source:
  enabled: true
  model_path: /home/admin/BTL_IOT/models/source_logreg.json
  vote_n: 3
  min_confidence: 0.6
  max_gap_s: 30
  stale_s: 15

# Web trên cloud (thư mục cloud/, deploy lên Render): aiot/uplink.py đẩy số liệu, nhãn AI,
# dự báo, nhật ký lên url mỗi interval_s giây và nhận lệnh quạt/còi/chế độ từ web.
# INGEST_TOKEN nằm trong .env (cùng giá trị với biến môi trường INGEST_TOKEN trên Render).
cloud:
  enabled: true             # bật sau khi đã deploy và đặt url
  url: https://aiot-tram.onrender.com
  interval_s: 5
  timeout_s: 10
  history_step_s: 60
  command_max_age_s: 60
